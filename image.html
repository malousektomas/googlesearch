<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Google Image Search</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <nav class="top-links">
            <a href="index.html">Google Search</a>
            <a href="advanced.html">Advanced Search</a>
            <a href="forms.html">Forms</a>
            <a href="https://malousektomas.github.io/">Portfolio</a>
        </nav>

        <main class="search-page">
            <div class="google-logo" aria-label="Google Search">Google Search</div>
            <div class="page-label">Images</div>
            <form class="search-form" action="https://www.google.com/search" method="get">
                <input type="hidden" name="tbm" value="isch">
                <input class="search-input" type="text" name="q" aria-label="Image search" autofocus>
                <div class="button-row">
                    <button type="submit">Image Search</button>
                </div>
            </form>
        </main>
        <footer class="site-footer">
            <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fmalousektomas.github.io%2Fgooglesearch%2Fimage.html">Validate HTML</a>
            <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fmalousektomas.github.io%2Fgooglesearch%2Fstyles.css">Validate CSS</a>
            <a href="https://github.com/malousektomas/googlesearch/blob/main/citace.md">Citations and sources</a>
            <a href="https://malousektomas.github.io/">Portfolio</a>
        </footer>
    </body>
</html>
